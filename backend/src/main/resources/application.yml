server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

spring:
  application:
    name: wifi-nms-backend
  lifecycle:
    timeout-per-shutdown-phase: 20s

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:wifinms}
    username: ${POSTGRES_USER:nms_admin}
    password: ${POSTGRES_PASSWORD:nms_secret}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: false

  data:
    mongodb:
      uri: mongodb://${MONGO_HOST:localhost}:${MONGO_PORT:27017}/${MONGO_DB:wifinms_logs}
      auto-index-creation: true
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 3s

nms:
  mqtt:
    broker-url: ${MQTT_BROKER_URL:tcp://localhost:1883}
    client-id: ${MQTT_CLIENT_ID:wifi-nms-backend-01}
    username: ${MQTT_USERNAME:}
    password: ${MQTT_PASSWORD:}
    enabled: ${MQTT_ENABLED:true}
  device:
    heartbeat-ttl-seconds: ${HEARTBEAT_TTL_SECONDS:45}
    ota-lock-ttl-seconds: ${OTA_LOCK_TTL_SECONDS:120}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha

logging:
  level:
    com.delta.nms: INFO
