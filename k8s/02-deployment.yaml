apiVersion: apps/v1
kind: Deployment
metadata:
  name: nms-backend
  namespace: wifi-nms
  labels:
    app: nms-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nms-backend
  template:
    metadata:
      labels:
        app: nms-backend
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: nms-backend
          image: wifi-nms-backend:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: nms-backend-config
            - secretRef:
                name: nms-backend-secret
          resources:
            requests:
              cpu: "250m"
              memory: "384Mi"
            limits:
              cpu: "1000m"
              memory: "768Mi"
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 35
            periodSeconds: 15
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 5"]
